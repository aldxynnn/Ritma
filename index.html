<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Ritma/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RITMA — One platform. Every fitness business.">
  <meta name="theme-color" content="#141715">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RITMA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RITMA — One platform. Every fitness business.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #141715;
      color: #F6F4ED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ritma-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #141715;
      pointer-events: none;
    }
    #ritma-boot-mark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #C7F36B;
    }
    #ritma-boot-sub {
      font-size: 12px;
      color: #A5AEA7;
    }
  </style>
</head>
<body>
  <div id="ritma-boot" aria-hidden="true">
    <div id="ritma-boot-mark">RITMA</div>
    <div id="ritma-boot-sub">One platform. Every fitness business.</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
