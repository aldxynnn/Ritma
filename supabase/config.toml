# RITMA Supabase Local Development Configuration
project_id = "ritma"

[api]
enabled = true
port = 54321
# Exclude `private` and `authz` schemas from direct PostgREST API exposure.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://127.0.0.1:8091", "http://localhost:8091", "com.ritma.ritma://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
# DEV/DEMO ONLY: Allows immediate sign-in after sign-up during local/cloud dev testing.
# MUST be set back to `true` before production launch.
enable_confirmations = false
